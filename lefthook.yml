# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    # Only staged files, so unrelated work in progress is never rewritten.
    - name: biome
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm run typecheck
    - name: unused-code
      run: pnpm run check:unused

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: biome-ci
      run: pnpm exec biome ci .
    # Builds the production image to prove it still works, then throws it away.
    # The build runs `pnpm build`, so types and the Next.js build are covered too.
    - name: docker-build
      run: |
        if ! docker info >/dev/null 2>&1; then
          echo "Docker is not running, skipping image build."
          exit 0
        fi
        docker compose build --quiet
        docker image rm fachalik-portfolio:latest || true
        docker image prune -f --filter label=org.opencontainers.image.title=fachalik-portfolio
