name: fachalik-portfolio

services:
  web:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: fachalik-portfolio:latest
    container_name: fachalik-portfolio
    ports:
      - "3000:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    restart: unless-stopped
